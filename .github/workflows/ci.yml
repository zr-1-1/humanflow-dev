name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Run all unit tests
        shell: pwsh
        run: |
          $testFiles = @(Get-ChildItem tests -Filter '*.test.mjs' | ForEach-Object FullName)
          node --test --test-concurrency=1 @testFiles
          exit $LASTEXITCODE
      - name: Build extension
        run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.os }}-node${{ matrix.node }}
          path: dist/*.vsix

  ui:
    name: 面板交互检查（Chromium）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 确认可用浏览器
        run: command -v google-chrome || command -v chromium || command -v chromium-browser
      - run: npm run test:ui
