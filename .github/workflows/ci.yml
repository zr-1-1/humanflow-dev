name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 离线测试（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  ui:
    name: 面板交互检查（Chromium）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 确认可用浏览器
        run: command -v google-chrome || command -v chromium || command -v chromium-browser
      - run: npm run test:ui

  package:
    name: 打包 VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: humanflow-vsix
          path: dist/*.vsix
          retention-days: 7
