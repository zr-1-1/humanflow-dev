name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的标签，例如 v0.4.1
        required: true

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 VSIX
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 校验标签与版本
        run: node -e "if (process.env.TAG !== 'v' + require('./package.json').version) process.exit(1)"
      - run: node --test --test-concurrency=1 tests/*.test.mjs
      - run: npm run package
      - name: 生成安装包校验文件
        run: |
          cd dist
          sha256sum *.vsix > "humanflow-${TAG#v}.vsix.sha256"
      - name: 准备 Release 说明
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 优先使用 CHANGELOG 中与标签对应的段落，再附上 GitHub 自动汇总；
          # 两者都取不到时留空，由后面的步骤回退为 GitHub 默认说明。
          version="${TAG#v}"
          section="$(awk -v heading="## [${version}]" 'index($0, heading) == 1 { capture = 1; next } capture && /^## / { exit } capture' CHANGELOG.md 2>/dev/null || true)"
          automatic="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="${TAG}" --jq .body 2>/dev/null || true)"
          if [ -n "${section}" ] && [ -n "${automatic}" ]; then
            body="${section}"$'\n\n'"---"$'\n\n'"${automatic}"
          else
            body="${section}${automatic}"
          fi
          { echo "body<<RELEASE_NOTES"; printf '%s\n' "${body}"; echo "RELEASE_NOTES"; } >> "$GITHUB_OUTPUT"
      - name: 创建 GitHub Release 并附加 VSIX 与校验文件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.notes.outputs.body }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::此版本已经发布，请检查现有 Release；不覆盖其文件"
            exit 1
          fi
          if [ -n "${NOTES}" ]; then
            gh release create "$TAG" dist/*.vsix dist/*.vsix.sha256 --title "HumanFlow $TAG" --notes "$NOTES" --verify-tag
          else
            gh release create "$TAG" dist/*.vsix dist/*.vsix.sha256 --title "HumanFlow $TAG" --generate-notes --verify-tag
          fi
